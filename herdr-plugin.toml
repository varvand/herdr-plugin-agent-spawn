id = "local.agent-spawn"
name = "Spawn agents"
version = "0.1.0"
description = "Open several coding-agent panes from one prompt"
platforms = ["macos", "linux"]
min_herdr_version = "0.9.0"

[[actions]]
id = "open"
title = "Spawn coding agents"
contexts = ["workspace"]
command = ["python3", "spawn.py", "--open"]

[[panes]]
id = "spawn"
title = "Spawn agents"
placement = "popup"
width = "40%"
height = 15
command = ["python3", "spawn.py"]
